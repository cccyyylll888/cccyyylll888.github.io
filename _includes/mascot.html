{%- comment -%}
  Pio 小恐龙吉祥物 (装饰用)
  Source: https://github.com/Dreamer-Paul/Pio (MIT, 内部用 Live2D 渲染)
  从 jsdelivr CDN 加载 css/js/模型, 不打包资源到本仓库.
  通过 _config.yml 的 mascot: true/false 控制启用.
{%- endcomment -%}
{% if site.mascot %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Dreamer-Paul/Pio@master/static/pio.css">
  <div class="pio-container">
    <div class="pio-action"></div>
    <canvas id="pio" width="200" height="180"></canvas>
  </div>
  <script src="https://cdn.jsdelivr.net/gh/Dreamer-Paul/Pio@master/static/l2d.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/Dreamer-Paul/Pio@master/static/pio.js"></script>
  <script>
    new Paul_Pio({
      mode: "draggable",
      hidden: false,
      tips: true,
      model: [
        "https://cdn.jsdelivr.net/npm/live2d-widget-model-hijiki/assets/hijiki.model.json",
        "https://cdn.jsdelivr.net/npm/live2d-widget-model-tororo/assets/tororo.model.json"
      ],
      content: {
        welcome: [
          "欢迎来到陈宇梁的主页～",
          "今天又在敲 Lean 吗？",
          "数学其实很美，对吧？",
          "找点感兴趣的东西看看吧"
        ],
        home: "回主页看看？",
        skin: ["想看看另一只猫咪吗？", "换好啦～"],
        close: "下次再见～"
      }
    });
  </script>
{% endif %}
