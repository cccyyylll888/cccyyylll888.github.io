###########################################################
### Welcome to Beautiful Jekyll!
### This config file is meant for settings that affect your entire website.
###########################################################

############################
# --- Required options --- #
############################

# Name of website (per-language; nav.html picks based on current page URL)
title: 陈宇梁的主页
title-en: Chen Yuliang's Homepage
title-fr: La page de Chen Yuliang

# Your name to show in the footer
author: 陈宇梁 (Chen Yuliang)

###############################################
# --- List of links in the navigation bar --- #
###############################################

# Chinese (default)
navbar-links:
  关于我: "aboutme"
  GitHub: "https://github.com/cccyyylll888"

# English (used when page URL contains /en/)
navbar-links-en:
  About Me: "/en/aboutme/"
  GitHub: "https://github.com/cccyyylll888"

# French (used when page URL contains /fr/)
navbar-links-fr:
  À propos: "/fr/aboutme/"
  GitHub: "https://github.com/cccyyylll888"

################
# --- Logo --- #
################

# Image to show in the navigation bar - works best with a square image
avatar: "/assets/img/avatar-icon.png"

# By default, the image is cut into a circle. You can disable this behaviour by setting 'round-avatar: false'
round-avatar: true


#####################################
# --- Footer social media links --- #
#####################################

# Select the social network links that you want to show in the footer.
social-network-links:
  email: "cyl2500@mail.ustc.edu.cn"
  github: cccyyylll888

# If you want your website to generate an RSS feed, provide a description
rss-description: 陈宇梁的个人主页

###########################
# --- General options --- #
###########################

# Select which social network share links to show in posts
share-links-active:
  twitter: true
  facebook: true
  linkedin: true
  vk: false
  reddit: false

# How to display the link to your website in the footer
url-pretty: "https://cccyyylll888.github.io"

# Add the website title to the title of every page
title-on-all-pages: true

# Excerpt word length - Truncate the excerpt of each post on the feed page to the specified number of words
excerpt_length: 50

# Whether or not to show an excerpt for every blog post in the feed page
feed_show_excerpt: true

# Whether or not to show a list of tags below each post preview in the feed page
feed_show_tags: true

# Add a search button to the navbar
post_search: true

# Add a button in the footer to edit the current page. Only works if your website is hosted on GitHub
edit_page_button: false

# 右下角动态小人吉祥物 (Pio 小恐龙). 关闭只需改为 false.
# 资源从 jsdelivr CDN 加载, 不打包到仓库.
mascot: true

# Allow sub-menu items (second-level navigation menu items) to be longer than the top-level menu
navbar-var-length: false

# The keywords to associate with your website, for SEO purposes
keywords: "陈宇梁,Chen Yuliang,USTC,中国科学技术大学,华罗庚数学英才班,少年班学院,数学,Lean,机器学习"

######################################
# --- Colours / background image --- #
######################################

# Personalize the colours in your website. Colour values can be any valid CSS colour
page-col: "#FFFFFF"
text-col: "#404040"
link-col: "#0066CC"
hover-col: "#003D7A"
navbar-col: "#F5F5F5"
navbar-text-col: "#2C3E50"
navbar-border-col: "#DDDDDD"
footer-col: "#F5F5F5"
footer-text-col: "#666666"
footer-link-col: "#2C3E50"
footer-hover-col: "#0066CC"

# Suggest a colour for mobile browsers to use as the browser's theme.
mobile-theme-col: "#0066CC"

################
# --- Misc --- #
################

# Ruby Date Format to show dates of posts
date_format: "%Y-%m-%d"

#################################################################################
# --- You don't need to touch anything below here (but you can if you want) --- #
#################################################################################

# Output options (more information on Jekyll's site)
timezone: "Asia/Shanghai"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5

kramdown:
  input: GFM

# Default YAML values (more information on Jekyll's site)
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      social-share: true
  -
    scope:
      path: ""
    values:
      layout: "page"

# Exclude these files from production site
exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/
  - Appraisals
  - beautiful-jekyll-theme.gemspec
  - staticman.yml

plugins:
  - jekyll-paginate
  - jekyll-sitemap

